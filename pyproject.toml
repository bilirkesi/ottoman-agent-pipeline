[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ottoman-agent-pipeline"
version = "0.1.0"
description = "Uçtan uca Ottoman Turkish transliteration agent pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bilirkesi AI Team", email = "research@bilirkesi.ai"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "networkx>=3.0",
    "cryptography>=42.0",
    "ottoman-transliterator>=0.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "basedpyright>=1.15.0",
]

[project.scripts]
ottoman-agent = "ottoman_agent_pipeline.cli:main"
ottoman = "ottoman_agent_pipeline.cli:main"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Bilinçli olarak devre dışı bırakılan kurallar (kod tabanı desenleri):
# - BLE001: route/araç katmanı kullanıcı dostu hata döndürmek için geniş `except` kullanır
# - DTZ005: proje naive yerel zaman kullanır (timezone politikası tanımlı değil)
# - B008: FastAPI `Body(...)`/`Field(...)` default deseni proje genelinde kullanılır
# - ASYNC230: dosya tool'ları küçük dosyalarla çalışır; sync open pratikte sorun değil
extend-ignore = ["BLE001", "DTZ005", "B008", "ASYNC230"]

[tool.basedpyright]
# Tip kontrolü: mypy yerine basedpyright (daha hızlı, VS Code/Pylance uyumlu).
# Basic mod + kapatılan kurallar:
# - reportMissingTypeArgument: proje `list`/`dict` jeneriklerini parametresiz
#   kullanır (mekanik 132 hata; tip disiplini ayrı iş olarak izleniyor)
# - reportAny/Unknown*/ExplicitAny/MissingParameterType/UnannotatedClassAttribute:
#   proje Any tabanlı helper desenleri kullanır; uyarı gürültüsünü azaltır
# - reportUnusedParameter/UnusedCallResult: kalıtım/interface desenleri
typeCheckingMode = "basic"
reportMissingTypeArgument = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportMissingParameterType = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedParameter = "none"
reportUnusedCallResult = "none"
reportIncompatibleMethodOverride = "none"

# agents/ modülü iki paralel agent tasarımını (AgentTeam + AgentBus/ProjectOrchestrator)
# birleştirir; tip uyumsuzlukları biliniyor, birleştirme/yeniden tasarım ayrı iş.
[[tool.basedpyright.overrides]]
files = ["src/ottoman_agent_pipeline/agents/**"]
reportArgumentType = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportOptionalMemberAccess = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"

[tool.hatch.build.targets.wheel]
packages = ["src/ottoman_agent_pipeline"]
